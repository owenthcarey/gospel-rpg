name: Quality
# Main pushes run these checks through the Pages workflow before publishing.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - name: Keep production build
        uses: actions/upload-artifact@v7
        with:
          name: game-build
          path: dist/
          retention-days: 7
  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Keep the expanded desktop journeys below Playwright's 15-minute suite limit.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: game-build
          path: dist/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Keep browser reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-reports-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  # Preserve the existing required check as a gate over build AND every browser shard.
  verify:
    if: ${{ always() }}
    needs: [build, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every quality check to pass
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$BUILD_RESULT" = success && test "$BROWSER_RESULT" = success
