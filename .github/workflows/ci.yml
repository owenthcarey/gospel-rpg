name: Quality
# Main pushes run these checks through the Pages workflow before publishing.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      browser-shards: ${{ steps.browser-plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - name: Check evidence, types, lint, tests and build
        run: npm run check
      - name: Plan browser groups from recorded runtimes
        id: browser-plan
        run: npm run test:e2e:plan
      - name: Keep browser plan
        uses: actions/upload-artifact@v4
        with:
          name: browser-plan
          path: artifacts/browser-plan/
          if-no-files-found: error
          retention-days: 7
      - name: Keep production build
        uses: actions/upload-artifact@v4
        with:
          name: game-build
          path: dist/
          retention-days: 7
  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Keep long journeys apart and grow the matrix as the suite grows.
        shard: ${{ fromJSON(needs.build.outputs.browser-shards) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: game-build
          path: dist/
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        with:
          name: browser-plan
          path: artifacts/browser-plan/
      - run: npm run test:e2e -- --test-list=artifacts/browser-plan/${{ matrix.shard }}.txt
      - name: Keep browser reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-reports-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  continuous:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: game-build
          path: dist/
      - run: npx playwright install --with-deps chromium
      # Keep the uninterrupted four-chapter journey out of mixed software-WebGL shards.
      - run: npm run test:e2e -- tests/e2e/continuous-journey.spec.ts --project=chromium --global-timeout=1200000
      - name: Keep continuous journey report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: continuous-journey-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  compatibility:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: game-build
          path: dist/
      - run: npx playwright install firefox webkit
      - run: npm run test:compat
      - name: Keep compatibility report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-report
          path: test-results-compat/
          retention-days: 7
  # Preserve the required check as a gate over build, every shard and the continuous journey.
  verify:
    if: ${{ always() }}
    needs: [build, browser, continuous, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every quality check to pass
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          CONTINUOUS_RESULT: ${{ needs.continuous.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
        run: test "$BUILD_RESULT" = success && test "$BROWSER_RESULT" = success && test "$CONTINUOUS_RESULT" = success && test "$COMPATIBILITY_RESULT" = success
